<body>

<!-- LOGIN -->
<div id="login">
    <h1>🔐 Login ADM</h1>

    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">

<label>
    <input
        type="checkbox"
        onclick="verSenha()"
    >
    Mostrar senha
</label>

    <button onclick="fazerLogin()">Entrar</button>

    <p id="erro"></p>
</div>

<!-- PAINEL -->
<div id="painel" style="display:none;">

    <h1> Ponto Do Sabor-ADM</h1>

    <div class="categoria">
        🏠 Página Inicial
        <button onclick="liberar('index')">Liberar</button>
        <button onclick="bloquear('index')">Bloquear</button>
    </div>

    <div class="categoria">
        🍽️ Jantinhas e Barcas
        <button onclick="liberar('jantinhas')">Liberar</button>
        <button onclick="bloquear('jantinhas')">Bloquear</button>
    </div>

    <div class="categoria">
        🍔 Combos
        <button onclick="liberar('combos')">Liberar</button>
        <button onclick="bloquear('combos')">Bloquear</button>
    </div>

    <div class="categoria">
        🥔 Porções
        <button onclick="liberar('porcoes')">Liberar</button>
        <button onclick="bloquear('porcoes')">Bloquear</button>
    </div>

    <div class="categoria">
        🥤 Bebidas
        <button onclick="liberar('bebidas')">Liberar</button>
        <button onclick="bloquear('bebidas')">Bloquear</button>
    </div>

    <div class="categoria">
        🍢 Espetinhos
        <button onclick="liberar('espetinhos')">Liberar</button>
        <button onclick="bloquear('espetinhos')">Bloquear</button>
    </div>

    <div class="categoria">
        🍱 Marmitex
        <button onclick="liberar('marmitex')">Liberar</button>
        <button onclick="bloquear('marmitex')">Bloquear</button>
    </div>



    <div class="categoria">
        📦 Informações Delivery
        <button onclick="liberar('delivery')">Liberar</button>
        <button onclick="bloquear('delivery')">Bloquear</button>
    </div>

    <div class="categoria">
        🛒 Carrinho
        <button onclick="liberar('carrinho')">Liberar</button>
        <button onclick="bloquear('carrinho')">Bloquear</button>
    </div>

    <hr>

    <button onclick="liberarTudo()" style="background:green;color:white;">
        ✅ Liberar Tudo
    </button>

    <button onclick="bloquearTudo()" style="background:red;color:white;">
        🔒 Bloquear Tudo
    </button>

    <button onclick="sair()">
        🚪 Sair
    </button>

</div>


<style>

    #login, #painel {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        font-size: 18px;
        background-color: #f9f9f9;
        color: #333;
        border: 1px solid #ccc;
        padding: 20px;

    }
    .categoria {
        font-family: Arial, sans-serif;
        padding: 10px;
        margin: 10px;
        background-color: #f0f0f0;
        color: #333;
        border-radius: 5px;
        font-size: 18px;
        text-align: center;
    }
      .categoria button {
        margin: 5px;
        padding: 5px 10px;
        font-size: 16px;
        cursor: pointer;
        background-color: #007BFF;
        color: white;
        border-radius: 6px;
    }

    .categoria button:hover {
        background-color: #052648;
    }


    button {
        font-family: Arial, sans-serif;
        padding: 10px 20px;
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        opacity: 0.8;
    }
    h1 {
        font-family: Arial, sans-serif;
        text-align: center;
    }

    input {
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        display: block;
        margin: 15px auto;
        padding: 5px;
    }  

   input[type="checkbox"] {
    width: 20px;
    display: inline-block;
    margin-right: 5px;
    transform: scale(1.2);
    cursor: pointer;
}
    

</style>
<script>

// CONFIGURAÇÃO DO LOGIN
const USUARIO = "admin";
const SENHA = "Ponto123";

// Verificar sessão
if(localStorage.getItem("adminLogado") === "true"){
    mostrarPainel();
}

function fazerLogin(){

    let usuario = document.getElementById("usuario").value;
    let senha = document.getElementById("senha").value;

    if(usuario === USUARIO && senha === SENHA){

        localStorage.setItem("adminLogado","true");
        mostrarPainel();

    }else{

        document.getElementById("erro").innerText =
        "Usuário ou senha inválidos";

    }

}

function mostrarPainel(){
    document.getElementById("login").style.display = "none";
    document.getElementById("painel").style.display = "block";
}

function sair(){
    localStorage.removeItem("adminLogado");
    location.reload();
}

function liberar(categoria){
    localStorage.setItem(categoria,"liberado");
    alert("✅ Categoria liberada!");
}

function bloquear(categoria){
    localStorage.setItem(categoria,"bloqueado");
    alert("🔒 Categoria bloqueada!");
}

const itens = [
    "index",
    "jantinhas",
    "combos",
    "porcoes",
    "bebidas",
    "espetinhos",
    "marmitex",
    "delivery",
    "carrinho"
];


function liberarTudo(){

    itens.forEach(item => {
        localStorage.setItem(item, "liberado");
    });

    alert("✅ Tudo liberado!");
}

function bloquearTudo(){

    itens.forEach(item => {
        localStorage.setItem(item, "bloqueado");
    });

    alert("🔒 Tudo bloqueado!");
}

function verSenha() {

    const campoSenha = document.getElementById("senha");

    campoSenha.type =
        campoSenha.type === "password"
        ? "text"
        : "password";

}


</script>

</body>
