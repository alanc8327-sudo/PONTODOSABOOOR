<body>

<!-- LOGIN -->
<div id="login">
    <h1>🔐 Login ADM</h1>

    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">

<label>
    <input
        type="checkbox"
        onclick="verSenha()"
    >
    Mostrar senha
</label>

    <button onclick="fazerLogin()">Entrar</button>

    <p id="erro"></p>
</div>

<!-- PAINEL -->
<div id="painel" style="display:none;">

    <h1> Ponto Do Sabor-ADM</h1>

   <div class="categoria" data-item="index">
🏠 Página Inicial
<button onclick="liberar('index')">Liberar</button>
<button onclick="bloquear('index')">Bloquear</button>
</div>
 
<div class="categoria" data-item="jantinhas">
🍽️ Jantinhas e Barcas
<button onclick="liberar('jantinhas')">Liberar</button>
<button onclick="bloquear('jantinhas')">Bloquear</button>
</div>
 
<div class="categoria" data-item="combos">
🍔 Combos
<button onclick="liberar('combos')">Liberar</button>
<button onclick="bloquear('combos')">Bloquear</button>
</div>
 
<div class="categoria" data-item="porcoes">
🥔 Porções
<button onclick="liberar('porcoes')">Liberar</button>
<button onclick="bloquear('porcoes')">Bloquear</button>
</div>
 
<div class="categoria" data-item="bebidas">
🥤 Bebidas
<button onclick="liberar('bebidas')">Liberar</button>
<button onclick="bloquear('bebidas')">Bloquear</button>
</div>
 
<div class="categoria" data-item="espetinhos">
🍢 Espetinhos
<button onclick="liberar('espetinhos')">Liberar</button>
<button onclick="bloquear('espetinhos')">Bloquear</button>
</div>
 
<div class="categoria" data-item="marmitex">
🍱 Marmitex
<button onclick="liberar('marmitex')">Liberar</button>
<button onclick="bloquear('marmitex')">Bloquear</button>
</div>
 
<div class="categoria" data-item="delivery">
📦 Informações Delivery
<button onclick="liberar('delivery')">Liberar</button>
<button onclick="bloquear('delivery')">Bloquear</button>
</div>
 
<div class="categoria" data-item="carrinho">
🛒 Carrinho
<button onclick="liberar('carrinho')">Liberar</button>
<button onclick="bloquear('carrinho')">Bloquear</button>
</div>

    <hr>

    <button onclick="liberarTudo()" style="background:green;color:white;">
        ✅ Liberar Tudo
    </button>

    <button onclick="bloquearTudo()" style="background:red;color:white;">
        🔒 Bloquear Tudo
    </button>

    <button onclick="sair()">
        🚪 Sair
    </button>

</div>


<style>

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f5f5;
    padding:15px;
    font-family:Arial,sans-serif;
}

#login,
#painel{
    width:100%;
    max-width:900px;
    margin:20px auto;
    text-align:center;
    background:#fff;
    color:#333;
    border:1px solid #ddd;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    margin-bottom:20px;
    font-size:2rem;
}

input[type="text"],
input[type="password"]{
    width:100%;
    max-width:400px;
    padding:12px;
    margin:10px auto;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    display:block;
}

label{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:15px 0;
}

input[type="checkbox"]{
    width:auto;
    transform:scale(1.2);
    cursor:pointer;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 16px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    opacity:.85;
}

.categoria{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:10px;
    background:#f0f0f0;
    margin:12px 0;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

.categoria button{
    background:#007BFF;
    color:white;
    min-width:110px;
}

.categoria button:hover{
    background:#052648;
}

.status{
    display:block;
    width:100%;
    margin-top:8px;
    font-size:15px;
    font-weight:bold;
}

#erro{
    color:red;
    font-weight:bold;
    margin-top:15px;
}

.acoes-gerais{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

/* ==========================
   TABLET
========================== */

@media (max-width:768px){

    h1{
        font-size:1.6rem;
    }

    .categoria{
        font-size:16px;
        padding:12px;
    }

    .categoria button{
        width:100%;
        max-width:250px;
    }

}

/* ==========================
   CELULAR
========================== */

@media (max-width:480px){

    body{
        padding:10px;
    }

    #login,
    #painel{
        padding:15px;
    }

    h1{
        font-size:1.3rem;
    }

    input{
        font-size:15px;
    }

    .categoria{
        flex-direction:column;
        gap:8px;
        font-size:15px;
    }

    .categoria button{
        width:100%;
        max-width:none;
    }

    button{
        width:100%;
    }

}
    

</style>
<script>

// =========================
// CONFIGURAÇÕES
// =========================

const USUARIO = "admin";
const SENHA = "Pontodosabor123";

const itens = [
    "index",
    "jantinhas",
    "combos",
    "porcoes",
    "bebidas",
    "espetinhos",
    "marmitex",
    "delivery",
    "carrinho"
];

// =========================
// INICIALIZAÇÃO
// =========================

document.addEventListener("DOMContentLoaded", () => {

    if (sessionStorage.getItem("adminLogado") === "true") {

        mostrarPainel();

    }

    const senhaInput = document.getElementById("senha");

    senhaInput.addEventListener("keypress", function(e){

        if(e.key === "Enter"){

            fazerLogin();

        }

    });

});

// =========================
// LOGIN
// =========================

function fazerLogin(){

    const usuario =
        document.getElementById("usuario").value.trim();

    const senha =
        document.getElementById("senha").value;

    const erro =
        document.getElementById("erro");

    erro.innerText = "";

    if(!usuario || !senha){

        erro.innerText =
        "Preencha usuário e senha.";

        return;

    }

    if(usuario === USUARIO && senha === SENHA){

        sessionStorage.setItem(
            "adminLogado",
            "true"
        );

        mostrarPainel();

    }else{

        erro.innerText =
        "Usuário ou senha inválidos.";

    }

}

// =========================
// MOSTRAR PAINEL
// =========================

function mostrarPainel(){

    document.getElementById("login")
        .style.display = "none";

    document.getElementById("painel")
        .style.display = "block";

    atualizarStatus();

}

// =========================
// SAIR
// =========================

function sair(){

    if(confirm("Deseja sair do painel?")){

        sessionStorage.removeItem(
            "adminLogado"
        );

        location.reload();

    }

}

// =========================
// LIBERAR
// =========================

function liberar(categoria){

    localStorage.setItem(
        categoria,
        "liberado"
    );

    atualizarStatus();

    alert(
        "✅ " +
        categoria +
        " liberado!"
    );

}

// =========================
// BLOQUEAR
// =========================

function bloquear(categoria){

    localStorage.setItem(
        categoria,
        "bloqueado"
    );

    atualizarStatus();

    alert(
        "🔒 " +
        categoria +
        " bloqueado!"
    );

}

// =========================
// LIBERAR TUDO
// =========================

function liberarTudo(){

    if(
        !confirm(
            "Liberar todas as categorias?"
        )
    ){
        return;
    }

    itens.forEach(item=>{

        localStorage.setItem(
            item,
            "liberado"
        );

    });

    atualizarStatus();

    alert(
        "✅ Tudo liberado!"
    );

}

// =========================
// BLOQUEAR TUDO
// =========================

function bloquearTudo(){

    if(
        !confirm(
            "ATENÇÃO!\nDeseja realmente bloquear todo o site?"
        )
    ){
        return;
    }

    itens.forEach(item=>{

        localStorage.setItem(
            item,
            "bloqueado"
        );

    });

    atualizarStatus();

    alert(
        "🔒 Tudo bloqueado!"
    );

}

// =========================
// STATUS
// =========================

function atualizarStatus(){

    document.querySelectorAll(".status")
    .forEach(item => item.remove());

    document.querySelectorAll(".categoria")
    .forEach(categoria => {

        const item = categoria.dataset.item;

        const span = document.createElement("span");

        span.className = "status";
        span.style.marginLeft = "10px";

        if(localStorage.getItem(item) === "bloqueado"){

            span.innerHTML = " 🔴 BLOQUEADO";
            span.style.color = "red";

        }else{

            span.innerHTML = " 🟢 LIBERADO";
            span.style.color = "green";

        }

        categoria.appendChild(span);

    });

}

// =========================
// VER SENHA
// =========================

function verSenha(){

    const campo =
        document.getElementById("senha");

    campo.type =
        campo.type === "password"
        ? "text"
        : "password";

}


</script>

</body>
